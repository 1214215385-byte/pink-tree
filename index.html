<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 粒子圣诞树 - 进阶版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        /* 加载提示 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 16px;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 1s ease;
        }
    </style>
    <!-- 使用 Importmap 引入 Three.js 及后期处理 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">粒子聚集中...</div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // ==========================================
        // 1. 基础环境设置 (场景、相机、渲染器)
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // 纯黑背景
        // 黑色雾化效果，增强空间深度
        scene.fog = new THREE.FogExp2(0x000000, 0.015); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 35);
        camera.lookAt(0, 5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. 后期处理 (Bloom 辉光)
        // ==========================================
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.2,  // 强度 (Strength)
            0.2,  // 半径 (Radius)
            0.8   // 阈值 (Threshold)
        );
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // ==========================================
        // 3. 核心：8000+ 粒子圣诞树
        // ==========================================
        const treeParticleCount = 8500;
        const treeGeometry = new THREE.BufferGeometry();
        
        // 存储位置数据：当前位置、初始散落位置、目标树形位置
        const positions = new Float32Array(treeParticleCount * 3);
        const startPositions = new Float32Array(treeParticleCount * 3);
        const targetPositions = new Float32Array(treeParticleCount * 3);
        
        const treeHeight = 18;
        const treeRadius = 8;

        for (let i = 0; i < treeParticleCount; i++) {
            // 1. 计算目标树形位置 (螺旋圆锥)
            const y = Math.random() * treeHeight; // 高度 0 ~ 18
            const radiusRatio = 1 - (y / treeHeight); // 越往上越细
            // 螺旋角度，加入随机偏移使树更蓬松
            const angle = y * 1.5 + Math.random() * Math.PI * 2; 
            
            const r = treeRadius * radiusRatio * (0.8 + Math.random() * 0.3); // 半径随机微调
            
            const tx = Math.cos(angle) * r;
            const ty = y;
            const tz = Math.sin(angle) * r;
            
            targetPositions[i * 3] = tx;
            targetPositions[i * 3 + 1] = ty;
            targetPositions[i * 3 + 2] = tz;

            // 2. 计算初始散落位置 (四周远处)
            const startRadius = 30 + Math.random() * 30;
            const startTheta = Math.random() * Math.PI * 2;
            const startPhi = Math.acos(2 * Math.random() - 1);
            
            const sx = startRadius * Math.sin(startPhi) * Math.cos(startTheta);
            const sy = startRadius * Math.cos(startPhi) + 10;
            const sz = startRadius * Math.sin(startPhi) * Math.sin(startTheta);
            
            startPositions[i * 3] = sx;
            startPositions[i * 3 + 1] = sy;
            startPositions[i * 3 + 2] = sz;

            // 当前初始状态设为散落状态
            positions[i * 3] = sx;
            positions[i * 3 + 1] = sy;
            positions[i * 3 + 2] = sz;
        }

        treeGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // 生成圆形发光贴图
        function getParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 215, 0, 1)'); // #FFD700
            gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        const treeMaterial = new THREE.PointsMaterial({
            color: 0xFFD700,
            size: 0.25,
            map: getParticleTexture(),
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true // 开启近大远小
        });

        const treeParticles = new THREE.Points(treeGeometry, treeMaterial);
        const treeGroup = new THREE.Group();
        treeGroup.add(treeParticles);
        scene.add(treeGroup);

        // ==========================================
        // 4. 顶部闪烁的金色五角星
        // ==========================================
        const starGeo = new THREE.BufferGeometry();
        const starCount = 200;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount; i++) {
            // 用球体分布模拟星星形状
            const r = Math.random() * 1.5;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i*3+1] = r * Math.cos(phi) + treeHeight + 1.5; // 放置在树顶
            starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        
        const starMat = new THREE.PointsMaterial({
            color: 0xFFFAFA,
            size: 0.5,
            map: getParticleTexture(),
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const starMesh = new THREE.Points(starGeo, starMat);
        treeGroup.add(starMesh);

        // ==========================================
        // 5. 地面粒子 (深绿雪地)
        // ==========================================
        const groundCount = 3000;
        const groundGeo = new THREE.BufferGeometry();
        const groundPos = new Float32Array(groundCount * 3);
        const groundColors = new Float32Array(groundCount * 3);

        const color1 = new THREE.Color(0x2d5016);
        const color2 = new THREE.Color(0x3a621a);

        for (let i = 0; i < groundCount; i++) {
            const radius = 12 + Math.random() * 25;
            const angle = Math.random() * Math.PI * 2;
            // 添加高度微微起伏
            const y = -0.5 + Math.random() * 0.5;
            
            groundPos[i * 3] = Math.cos(angle) * radius;
            groundPos[i * 3 + 1] = y;
            groundPos[i * 3 + 2] = Math.sin(angle) * radius;

            // 随机分配深绿色
            const mixedColor = Math.random() > 0.5 ? color1 : color2;
            groundColors[i * 3] = mixedColor.r;
            groundColors[i * 3 + 1] = mixedColor.g;
            groundColors[i * 3 + 2] = mixedColor.b;
        }
        groundGeo.setAttribute('position', new THREE.BufferAttribute(groundPos, 3));
        groundGeo.setAttribute('color', new THREE.BufferAttribute(groundColors, 3));

        const groundMat = new THREE.PointsMaterial({
            size: 0.3,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: true
        });
        const groundParticles = new THREE.Points(groundGeo, groundMat);
        scene.add(groundParticles);

        // ==========================================
        // 6. 雪花粒子 (1500个，5种纹理)
        // ==========================================
        // 生成5种不同的雪花 Canvas 纹理
        function createSnowflakeTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.translate(32, 32);
            
            if(type === 0) { // 普通十字
                ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, 20); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.stroke();
            } else if(type === 1) { // 米字
                for(let i=0; i<4; i++) {
                    ctx.rotate(Math.PI/4);
                    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, 20); ctx.stroke();
                }
            } else if(type === 2) { // 六角星
                for(let i=0; i<3; i++) {
                    ctx.rotate(Math.PI/3);
                    ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, 20); ctx.stroke();
                }
            } else if(type === 3) { // 圆点
                ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fillStyle = '#FFF'; ctx.fill();
            } else { // 空心圈
                ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        const snowTextures = [
            createSnowflakeTexture(0),
            createSnowflakeTexture(1),
            createSnowflakeTexture(2),
            createSnowflakeTexture(3),
            createSnowflakeTexture(4)
        ];

        const snowGroup = new THREE.Group();
        const totalSnow = 1500;
        const snowSystems = []; // 存储5组雪花的数据用于动画

        // 分成5组，每组300个，使用不同的纹理
        for (let t = 0; t < 5; t++) {
            const count = totalSnow / 5;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const speeds = new Float32Array(count); // 下落速度
            const swayData = []; // 摇摆数据

            for (let i = 0; i < count; i++) {
                pos[i*3] = (Math.random() - 0.5) * 60; // X 范围
                pos[i*3+1] = Math.random() * 40;       // Y 范围
                pos[i*3+2] = (Math.random() - 0.5) * 60; // Z 范围
                
                speeds[i] = 0.02 + Math.random() * 0.05;
                swayData.push({
                    offset: Math.random() * Math.PI * 2,
                    speed: 0.01 + Math.random() * 0.02,
                    amplitude: 0.5 + Math.random() * 1.5
                });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

            const mat = new THREE.PointsMaterial({
                color: 0xFFFFFF,
                size: 0.5, // 约等于 2-4px 感
                map: snowTextures[t],
                transparent: true,
                opacity: 0.8,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const snowPoints = new THREE.Points(geo, mat);
            snowGroup.add(snowPoints);
            
            snowSystems.push({
                mesh: snowPoints,
                positions: pos,
                speeds: speeds,
                swayData: swayData
            });
        }
        scene.add(snowGroup);

        // ==========================================
        // 7. 交互与动画逻辑
        // ==========================================
        
        // 鼠标移动交互
        let mouseX = 0;
        let mouseY = 0;
        let targetMouseX = 0;
        let targetMouseY = 0;

        window.addEventListener('mousemove', (e) => {
            // 归一化到 -1 到 1
            targetMouseX = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // 动画状态控制
        let progress = 0; // 0 = 散落, 1 = 聚合
        let isExploding = false;
        let explodeTimer = 0;
        let snowSpeedMultiplier = 1.0;

        // 点击爆炸效果
        window.addEventListener('click', () => {
            if (progress > 0.8) { // 只有在树成型时才触发
                isExploding = true;
                explodeTimer = 0;
                snowSpeedMultiplier = 4.0; // 雪花加速
                
                // 生成爆炸目标位置（向外扩散）
                const currentPos = treeGeometry.attributes.position.array;
                for (let i = 0; i < treeParticleCount; i++) {
                    // 将当前位置作为新起点
                    startPositions[i*3] = currentPos[i*3];
                    startPositions[i*3+1] = currentPos[i*3+1];
                    startPositions[i*3+2] = currentPos[i*3+2];

                    // 在树形基础上向外偏离
                    targetPositions[i*3] = currentPos[i*3] * 2.5 + (Math.random() - 0.5) * 5;
                    targetPositions[i*3+1] = currentPos[i*3+1] + (Math.random() - 0.5) * 8;
                    targetPositions[i*3+2] = currentPos[i*3+2] * 2.5 + (Math.random() - 0.5) * 5;
                }
            }
        });

        // 恢复树形（内部函数）
        let originalTargets = new Float32Array(targetPositions); // 备份原始树形
        function resetTree() {
            for (let i = 0; i < treeParticleCount; i++) {
                targetPositions[i*3] = originalTargets[i*3];
                targetPositions[i*3+1] = originalTargets[i*3+1];
                targetPositions[i*3+2] = originalTargets[i*3+2];
            }
        }

        // 延迟3秒后开始聚合
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            // 启动聚合动画
            const startTime = Date.now();
            const animateProgress = () => {
                const elapsed = Date.now() - startTime;
                progress = Math.min(elapsed / 2000, 1); // 2秒内聚合完毕
                // 缓动函数 (easeOutCubic)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                const currentPos = treeGeometry.attributes.position.array;
                for (let i = 0; i < treeParticleCount; i++) {
                    currentPos[i*3] = startPositions[i*3] + (targetPositions[i*3] - startPositions[i*3]) * easeOut;
                    currentPos[i*3+1] = startPositions[i*3+1] + (targetPositions[i*3+1] - startPositions[i*3+1]) * easeOut;
                    currentPos[i*3+2] = startPositions[i*3+2] + (targetPositions[i*3+2] - startPositions[i*3+2]) * easeOut;
                }
                treeGeometry.attributes.position.needsUpdate = true;

                if (progress < 1) {
                    requestAnimationFrame(animateProgress);
                }
            };
            animateProgress();
        }, 3000);

        // ==========================================
        // 8. 渲染循环
        // ==========================================
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // 树整体缓慢旋转
            treeGroup.rotation.y += 0.005;

            // 鼠标跟随平滑插值
            mouseX += (targetMouseX - mouseX) * 0.05;
            mouseY += (targetMouseY - mouseY) * 0.05;
            
            // 让树和雪地产生轻微的视角跟随偏移
            treeGroup.rotation.x = mouseY * 0.1;
            treeGroup.rotation.z = -mouseX * 0.1;
            // 相机轻微反向移动增强立体感
            camera.position.x = mouseX * 2;
            camera.position.y = 5 + mouseY * 2;
            camera.lookAt(0, treeHeight / 2, 0);

            // 树顶星星闪烁
            starMat.opacity = 0.5 + Math.sin(elapsedTime * 5) * 0.5;

            // 处理爆炸恢复逻辑
            if (isExploding) {
                explodeTimer += delta;
                if (explodeTimer > 1.0) { // 1秒后开始重新聚合
                    isExploding = false;
                    resetTree();
                    
                    // 重置动画进度
                    const currentPos = treeGeometry.attributes.position.array;
                    for (let i = 0; i < treeParticleCount; i++) {
                        startPositions[i*3] = currentPos[i*3];
                        startPositions[i*3+1] = currentPos[i*3+1];
                        startPositions[i*3+2] = currentPos[i*3+2];
                    }
                    progress = 0;
                    
                    const startTime = Date.now();
                    const reanimateProgress = () => {
                        const elapsed = Date.now() - startTime;
                        progress = Math.min(elapsed / 1500, 1);
                        const easeInOut = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                        
                        for (let i = 0; i < treeParticleCount; i++) {
                            currentPos[i*3] = startPositions[i*3] + (targetPositions[i*3] - startPositions[i*3]) * easeInOut;
                            currentPos[i*3+1] = startPositions[i*3+1] + (targetPositions[i*3+1] - startPositions[i*3+1]) * easeInOut;
                            currentPos[i*3+2] = startPositions[i*3+2] + (targetPositions[i*3+2] - startPositions[i*3+2]) * easeInOut;
                        }
                        treeGeometry.attributes.position.needsUpdate = true;
                        if (progress < 1) requestAnimationFrame(reanimateProgress);
                    };
                    reanimateProgress();
                }
            }

            // 雪花下落逻辑
            if (snowSpeedMultiplier > 1.0) {
                snowSpeedMultiplier -= delta * 0.5; // 速度逐渐恢复
                if (snowSpeedMultiplier < 1.0) snowSpeedMultiplier = 1.0;
            }

            snowSystems.forEach(system => {
                const positions = system.positions;
                for (let i = 0; i < system.speeds.length; i++) {
                    // Y 轴下落
                    positions[i*3+1] -= system.speeds[i] * snowSpeedMultiplier * 60 * delta;
                    
                    // X 轴左右摇摆
                    const sway = system.swayData[i];
                    positions[i*3] += Math.sin(elapsedTime * sway.speed * 50 + sway.offset) * sway.amplitude * delta;

                    // 如果落到底部，重置到顶部
                    if (positions[i*3+1] < -2) {
                        positions[i*3+1] = 40;
                        positions[i*3] = (Math.random() - 0.5) * 60;
                        positions[i*3+2] = (Math.random() - 0.5) * 60;
                    }
                }
                system.mesh.geometry.attributes.position.needsUpdate = true;
            });

            // 渲染使用 composer 以应用 Bloom
            composer.render();
        }

        // 窗口大小自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 启动循环
        animate();
    </script>
</body>
</html>
