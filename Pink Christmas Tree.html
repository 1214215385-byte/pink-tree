<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Liu+Jian+Mao+Cao&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Long+Cang&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@700&family=Great+Vibes&family=Dancing+Script&family=Pacifico&family=Allura&family=Satisfy&display=swap">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#t{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);text-align:center;font:300 clamp(18px,4.6vw,34px) Georgia,'Times New Roman',serif;letter-spacing:.35em;color:#ffd6ea;text-shadow:0 0 18px #ff4fa3,0 0 42px #ff4fa3;opacity:0;animation:none;pointer-events:none}
#h{position:fixed;left:0;right:0;text-align:center;font:14px/1.4 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.2em;color:#ffb3d6;opacity:0;pointer-events:none}
#m{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:42px;height:42px;border-radius:50%;border:1px solid #ff8cc8;background:#000;color:#ffd6ea;font-size:20px;cursor:pointer;opacity:.8;padding:0;display:none}
#m.off{opacity:.35;text-decoration:line-through}
#g{position:fixed;left:0;right:0;text-align:center;font:14px/1.4 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.3em;color:#ffb3d6;pointer-events:none;animation:p 2.4s ease-in-out infinite;transition:opacity .6s}
@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
#gr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:42px;height:42px;border-radius:50%;border:1px solid #ff8cc8;background:#000;color:#ffd6ea;font-size:20px;cursor:pointer;opacity:.8;padding:0;display:none}
#pn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:14px;width:min(270px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:rgba(0,0,0,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #ff8cc8;border-radius:12px;padding:6px 14px 12px;box-sizing:border-box;color:#ffd6ea;font:13px/1.4 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;display:none}
.r{margin:10px 0}.r b{display:block;font-weight:500;margin-bottom:6px;opacity:.8}
.sw{display:inline}.sw i{display:inline-block;width:24px;height:24px;border-radius:50%;margin:0 8px 6px 0;border:2px solid transparent;cursor:pointer;vertical-align:middle;box-sizing:border-box}.sw i.on{border-color:#fff}
#pn input[type=text]{width:100%;box-sizing:border-box;background:#000;color:#ffd6ea;border:1px solid #ff8cc8;border-radius:8px;padding:7px;font-size:15px}
#pn select{width:100%;background:#000;color:#ffd6ea;border:1px solid #ff8cc8;border-radius:8px;padding:6px;font-size:14px}
#pn input[type=range]{width:100%;accent-color:#ff5fa2}
#pn input[type=color]{width:30px;height:26px;border:0;background:none;padding:0;vertical-align:middle;margin-bottom:6px}
#pn button{flex:1;min-width:0;padding:8px;background:#000;color:#ffd6ea;border:1px solid #ff8cc8;border-radius:8px;font-size:14px;cursor:pointer}
#pn button:active{background:#2a0a1a}
#s{position:fixed;left:0;top:0;height:auto;opacity:0;pointer-events:none;overflow:visible;will-change:transform;transform-origin:50% 50%}
#st{font-family:'Ma Shan Zheng','Liu Jian Mao Cao','STXingkai','STKaiti','Kaiti SC','KaiTi',cursive,serif;fill:#ffc2de;fill-opacity:0;stroke:#ffc2de;stroke-width:1.3;stroke-dasharray:700;stroke-dashoffset:700}
#gd{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6vh);text-align:center;font:300 clamp(16px,4vw,28px) 'Ma Shan Zheng','Liu Jian Mao Cao',Georgia,serif;letter-spacing:.25em;color:#ffd6ea;text-shadow:0 0 16px #ff4fa3,0 0 36px #ff4fa3;opacity:0;pointer-events:none;transition:opacity 1s ease,transform 1s ease}
#pf{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);transform:translateX(-50%);font:12px/1.4 -apple-system,'PingFang SC',sans-serif;color:#ffb3d6;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:20px;border:1px solid #ff8cc8;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;z-index:9}
#cr{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12vh);text-align:center;font:11px/1.4 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;letter-spacing:.15em;color:#ffd6ea;opacity:0;pointer-events:none}
@keyframes f6{to{opacity:.6}}
@keyframes f{to{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa" style="position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);pointer-events:none"></div>
<div id="g">点击这团粒子</div>
<div id="h"></div>
<div id="gd"></div>
<div id="pf"></div>
<svg id="s" viewBox="0 0 160 70"><text id="st" x="6" y="52" font-size="52">远赴.</text></svg>
<div id="t">Merry Christmas</div>
<div id="cr">远赴出品 天天开心</div>
<button id="m" aria-label="音乐">♪</button>
<button id="gr" aria-label="设置">⚙</button>
<div id="pn">

<div class="r"><b>粒子颜色</b><div class="sw" id="o1"></div><input type="color" id="k1" value="#ff5fa2"></div>
<div class="r"><b>粒子数量 <span id="o2v">100%</span></b><input type="range" id="o2" min="20" max="150" value="100"></div>
<div class="r"><b>粒子轨迹</b><select id="o3"><option value="0">随机漂游</option><option value="1">环绕旋转</option><option value="2">海浪飘移</option><option value="3">缓缓上升</option></select></div>
<div class="r"><b>星云颜色（超广角）</b><div class="sw" id="o20"></div><input type="color" id="k7" value="#7a5cff"></div>
<div class="r"><b>背景烟花颜色（超广角）</b><div class="sw" id="o22"></div><input type="color" id="k8" value="#ff7ab8"></div>
<div class="r"><b>星星颜色</b><div class="sw" id="o4"></div><input type="color" id="k2" value="#ffd36b"></div>
<div class="r"><b>星星轨迹</b><select id="o5"><option value="0">螺旋环绕</option><option value="1">蛇形摆动</option><option value="2">笔直上升</option></select></div>
<div class="r"><b>雪花颜色</b><div class="sw" id="o11"></div><input type="color" id="k4" value="#ffffff"></div>
<div class="r"><b>雪花数量 <span id="o12v">100%</span></b><input type="range" id="o12" min="0" max="300" value="100"></div>
<div class="r"><b>背景颜色</b><div class="sw" id="o13"></div><input type="color" id="k5" value="#000000"></div>
<div class="r"><b>拖尾样式</b><select id="o9"><option value="0">光点串</option><option value="1">实线</option><option value="2">星尘</option><option value="3">虚线</option><option value="4">无</option></select></div>
<div class="r"><b>拖尾颜色</b><div class="sw" id="o10"></div><input type="color" id="k3" value="#ffd36b"></div>
<div class="r"><b>到位后星星样式</b><select id="o14"></select></div>
<div class="r"><b>到位后星星颜色</b><div class="sw" id="o15"></div><input type="color" id="k6" value="#ffd36b"></div>
<div class="r"><b>开场问候（给谁）</b><input type="text" id="o19" maxlength="12" placeholder="留空则不显示" value=""></div>
<div class="r"><b>署名文字</b><input type="text" id="o6" maxlength="10" value="远赴."></div>
<div class="r"><b>超广角祝福语</b><input type="text" id="o21" maxlength="16" value="圣诞快乐，岁岁平安"></div>
<div class="r"><b>署名/祝福语字体</b><select id="o7"></select></div>
<div class="r"><b>署名出场</b><select id="o8"><option value="0">一笔勾勒</option><option value="1">笔锋书写</option><option value="2">渐显</option><option value="3">弹跳闪现</option></select></div>
<div class="r"><b>背景音乐</b><select id="o17"></select></div>
<div class="r"><b>音乐音量 <span id="o18v">55%</span></b><input type="range" id="o18" min="0" max="100" value="55"></div>
<div style="display:flex;gap:8px;margin-top:10px"><button id="rp">重新播放</button><button id="sv">保存设置</button></div>
<div style="display:flex;gap:8px;margin-top:8px"><button id="shot">截图保存</button><button id="rst">恢复默认</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),hint=$('h'),sig=$('s'),sigT=$('st'),gt=$('g'),btn=$('m'),gd=$('gd'),pf=$('pf');
const cols=['#ff5fa2','#ff86c0','#ff3d8b','#ffb3d6','#ffffff','#f060d8','#ff9ec9','#ffd36b'];
function spr(c){const s=64,o=document.createElement('canvas');o.width=o.height=s;const g=o.getContext('2d');g.fillStyle=c;g.beginPath();g.arc(32,32,30,0,6.283);g.fill();return o}
const S=cols.map(spr);
let NS=[];
let W,H,dpr,cx,cyT,TH,TR,P=[],NEB=[],snow=[],T0=performance.now(),sigX=0,sigY=0,sigWpx=120,tNow=0;
let wP=0,wT=0,wE=0,zE=1,pE=0,popT=-99,swapAt=0,fadeS=0,SAT=0,hint0=60,hintY=60,FW=[],fwTimer=0;
const tS=1,DUR=6,tB=7.6,tA=8.5,NL=9;
const cfg={fs:0,fc:null,sn:1,snc:null,bg:'#000000',ts:0,tc:null,sa:0,tg:8.5,cnt:1,wm:0,sm:0,sc:'#ffd36b',sl:'#ffefc4',p:cols.slice(0,7),tune:0,vol:.55,nc:'#7a5cff',fw:'mx'};
const DEF=JSON.parse(JSON.stringify(cfg));
const DEF_SIG='远赴.',DEF_FONT='Ma Shan Zheng',DEF_BL='圣诞快乐，岁岁平安';
let SP=[],spB=0,spF=0,started=false,vYaw=0,vPit=0,zm=1,yawV=0,orb=null,pd0=0,zm0=1;
const PT=new Map();
// —— 性能自动降级 ——
let perfLvl=0,perfT=performance.now(),perfN=0;
function degrade(){
  perfLvl++;
  const target=Math.round(P.length*.68);
  while(P.length>target)P.splice((Math.random()*P.length)|0,1);
  const nt=Math.round(NEB.length*.7);if(NEB.length>nt)NEB.length=nt;
  if(snow.length>50)snow.length=Math.round(snow.length*.7);
  pf.textContent='已自动降低粒子数量以保持流畅';
  pf.style.opacity=1;
  setTimeout(()=>{pf.style.opacity=0},3200);
}
function spawn(x,y,n,spd,g,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=spd*(.25+Math.random()*.75),L=life*(.5+Math.random()*.5);SP.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:g?140:0,l:L,m:L,z:1.6+Math.random()*2.2,c:[7,4,3,0,1,7][(Math.random()*6)|0]})}}
function cl(p,ts){const a=p.ca+p.cw*ts,br=1+.06*Math.sin(ts*1.3),x0=Math.cos(a)*p.cr*br,y0=Math.sin(a)*p.cr*.62*br+Math.sin(ts*.8+p.ph)*3,tl=-.5+ts*.12,c=Math.cos(tl),s=Math.sin(tl);return[cx+x0*c-y0*s,H/2+x0*s+y0*c]}
function drawStart(now){const ts=now/1000;ctx.globalAlpha=1;ctx.fillStyle=cfg.bg;ctx.fillRect(0,0,W,H);const fa=Math.min(1,ts/1.2);
  for(const p of P){if(!p.cv)continue;const q=cl(p,ts),d=p.size*1.5;ctx.globalAlpha=fa*Math.min(1,p.al*1.4)*(.75+.25*Math.sin(ts*p.tw+p.ph));ctx.drawImage(S[p.s],q[0]-d/2,q[1]-d/2,d,d)}}
function greet(){const v=$('o19').value.trim();if(!v)return;gd.textContent='给 '+v;gd.style.opacity=0;gd.style.transform='translateY(-10px)';
  requestAnimationFrame(()=>{gd.style.opacity=1;gd.style.transform='translateY(0)';setTimeout(()=>{gd.style.opacity=0;gd.style.transform='translateY(-8px)'},3800)})}
function go(now){const ts=now/1000;for(const p of P){const q=cl(p,ts);p.b0x=q[0];p.b0y=q[1]}spawn(cx,H/2,70,420,0,1.1);started=true;T0=now;gt.style.animation='none';gt.style.opacity=0;
  $('t').style.animation='f 3s ease 9s forwards';$('cr').style.animation='f6 3s ease 9s forwards';btn.style.display='block';$('gr').style.display='block';startMusic();greet();perfT=now;perfN=0}
function drawTrail(s,t,vis){
  if(s<=0||vis<.01||cfg.ts>3)return;
  const n=Math.max(2,Math.floor(s*420)),st=cfg.ts,col=cfg.tc||cfg.sc;let px,py;ctx.lineWidth=1.6;
  for(let i=0;i<=n;i++){const u=s*i/n,q0=stPos(u,vYaw),v2=vw(q0[0],q0[1]),q=[v2[0],v2[1],q0[2],q0[3]],f=i/n,al=(.22+.68*f)*vis*(q[3]>0?.55:1),c=col==='rb'?'hsl('+((u*360)|0)+',90%,65%)':col;
    if(st==1||st==3){if(i&&(st==1||(i>>1)%2==0)){ctx.globalAlpha=al;ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(q[0],q[1]);ctx.stroke()}}
    else if(st==2){const tw=.5+.5*Math.sin(t*3+i);ctx.globalAlpha=al*tw;ctx.fillStyle=c;ctx.beginPath();ctx.arc(q[0]+Math.sin(i*12.9)*6,q[1]+Math.cos(i*7.3)*6,1+(i%3)*.5,0,6.283);ctx.fill()}
    else{ctx.globalAlpha=al;ctx.fillStyle=c;ctx.beginPath();ctx.arc(q[0],q[1],1+f*1.6,0,6.283);ctx.fill()}
    px=q[0];py=q[1]}
}
function mkSnow(){snow=[];const n=Math.round(110*cfg.sn);for(let i=0;i<n;i++)snow.push({x:Math.random()*W,y:Math.random()*H,v:10+Math.random()*22,z:1+Math.random()*2.2,ph:Math.random()*6.283})}
function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.1,x,y-s*.45);ctx.bezierCurveTo(x+s*.8,y-s*1.1,x+s*1.5,y-s*.1,x,y+s*.9);ctx.closePath()}
function star(x,y,R,r,rot,n){n=n||5;ctx.beginPath();for(let i=0;i<2*n;i++){const a=rot+i*Math.PI/n-Math.PI/2,rr=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}
function drawFinal(x,y,R,rot){const s=cfg.fs;
  if(s==1){star(x,y,R*1.25,R*.3,rot,4);ctx.fill()}
  else if(s==2){heart(x,y,R);ctx.fill()}
  else if(s==3){star(x,y,R*1.1,R*.6,rot,6);ctx.fill()}
  else if(s==4){ctx.beginPath();ctx.arc(x,y,R*.6,0,6.283);ctx.fill();ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,R,0,6.283);ctx.stroke()}
  else{star(x,y,R*.95,R*.42,rot);ctx.fill()}}
function vw(x,y){return[cx+(x-cx)*zE,cyT+(y-cyT)*zE*Math.cos(pE)]}
function topPos(){const Y0=TH*.515,Z=Y0*Math.sin(pE),sc=TR*5/(TR*5+Z);return[cx,cyT-Y0*Math.cos(pE)*sc*zE]}
function viewDown(e){if(nowT()<9.7)return;PT.set(e.pointerId,[e.clientX,e.clientY]);if(PT.size==1){orb=e.pointerId;yawV=0}else if(PT.size==2){orb=null;const[a,b]=[...PT.values()];pd0=Math.hypot(a[0]-b[0],a[1]-b[1])||1;zm0=zm}}
function viewMove(e){const p=PT.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
  if(PT.size>=2){const[a,b]=[...PT.values()];zm=Math.max(.6,Math.min(2.6,zm0*Math.hypot(a[0]-b[0],a[1]-b[1])/pd0))}
  else if(orb===e.pointerId){vYaw+=dx*.008;yawV=dx*.008*60;vPit=Math.max(-.45,Math.min(.45,vPit+dy*.004))}}
function viewUp(e){PT.delete(e.pointerId);orb=PT.size==1?[...PT.keys()][0]:null}
function stPos(s,ya){if(cfg.sm){const yb=H+40,y0=sy0f(),y=yb+(y0-yb)*s,A=cfg.sm==1?TR*1.1*(1-s):TR*.08*(1-s);return[cx+A*Math.sin(s*(cfg.sm==1?18:25)),y,1,0]}const yb=H+40,y0=sy0f(),y=yb+(y0-yb)*s,sb=(yb-(cyT+TH/2))/(yb-y0),rr=TR*1.25/(1-sb)*(1-s),th=Math.PI+s*21.4+(ya||0),z=rr*Math.sin(th),sc=TR*5/(TR*5+z);return[cx+rr*Math.cos(th)*sc,y,sc,z]}
const sm=x=>{x=x<0?0:x>1?1:x;return x*x*(3-2*x)};
const prof=t=>(1-t*.95)*(.62+.38*(1-((t*4)%1)));
const sy0f=()=>cyT-TH/2-TH*.015;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;TH=Math.min(H*.57,W*1.25);TR=TH*.36;
  const top=Math.max(H*.21,(H-TH*1.14)/2);cyT=top+TH/2;
  SAT=$('sa').offsetHeight||0;hint0=Math.round(sy0f()-TH*.045*3.2-16);
  
  applySig();
  layoutTop();gt.style.top=Math.round(H/2+Math.min(W,H)*.2+44)+'px';
}
function layoutTop(){const sh=sig.offsetHeight||sigWpx*.4;hintY=Math.max(hint0,SAT+16+sh);hint.style.top=hintY+'px';sigX=cx;sigY=hintY-8-sh/2}
function launchFW(){
  const x=W*(.1+.8*Math.random()),y=H*(.1+.42*Math.random()),pl=['#ff7ab8','#ffd36b','#7ad0ff','#8dff7a','#ffffff','#c45fff'],mx=cfg.fw==='mx',base=mx?pl[(Math.random()*pl.length)|0]:cfg.fw,n=26+((Math.random()*14)|0);
  for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.2,v=70+Math.random()*90,L=.9+Math.random()*.7;FW.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:L,m:L,z:1.3+Math.random()*1.4,col:(mx&&Math.random()<.25)?pl[(Math.random()*pl.length)|0]:base})}
}
function drawFW(dt){for(let i=FW.length-1;i>=0;i--){const q=FW[i];q.l-=dt;if(q.l<=0){FW.splice(i,1);continue}const fr=Math.pow(.18,dt);q.vx*=fr;q.vy*=fr;q.vy+=40*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;ctx.globalAlpha=Math.min(1,q.l/q.m*1.5)*(.6+.4*Math.sin(q.l*30+i));ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,q.z/2,0,6.283);ctx.fill()}}
function mkNeb(){
  NEB=[];const mob=Math.min(innerWidth,innerHeight)<600,n=Math.round((mob?2400:4200)*cfg.cnt),D=Math.hypot(W,H)*.6;
  for(let i=0;i<n;i++){const ea=Math.random()*6.283;
    NEB.push({a:Math.random()*6.283,l:i%NL,j:(Math.random()-.5)*.045,d:Math.random(),sw:Math.random()<.5?-1:1,sx:cx+Math.cos(ea)*D,sy:cyT+Math.sin(ea)*D,sz:1.1+Math.random()*1.7,c:(Math.random()*4)|0,x:0,y:0,pa:0,pd:0,v:0,near:false})}
}
function calcNeb(t,cp,sp,F){
  const Rin=TR*.95,Rout=Math.min(TR*3.8,W*1.3),span=Rout-Rin;
  for(const q of NEB){
    const en=sm(Math.max(0,Math.min(1,(wP-q.d*.55)/.45)));
    if(en<=0){q.v=0;continue}
    const uu=(((q.l/NL+t*.06+q.j)%1)+1)%1,r=Rin+span*uu,a=q.a+t*.18+vYaw;
    const X=Math.cos(a)*r,Z0=Math.sin(a)*r,Y0=-TH*.53+Math.sin(uu*12.566-t*1.3+q.a*2)*TH*.03*(.4+uu);
    const Z=Y0*sp+Z0*cp,sc=F/(F+Z),tx=X*sc*zE,ty=-(Y0*cp-Z0*sp)*sc*zE;
    const rx=q.sx-cx,ry=q.sy-cyT,ang=q.sw*(1-en)*1.8,ca=Math.cos(ang),sa=Math.sin(ang),mx=rx*ca-ry*sa,my=rx*sa+ry*ca;
    q.x=cx+mx+(tx-mx)*en;q.y=cyT+my+(ty-my)*en;

swt($('o11'),SNC,v=>{cfg.snc=v},v=>v==='rb'?RB:(v||'repeating-linear-gradient(45deg,#fff 0 4px,#ff9ec9 4px 8px)'));

$('k1').oninput=e=>{[...$('o1').children].forEach(x=>x.className='');setPal(pal(e.target.value))};
$('k2').oninput=e=>{[...$('o4').children].forEach(x=>x.className='');cfg.sc=e.target.value;cfg.sl=mix(cfg.sc,.6);setPal(cfg.p)};
$('k3').oninput=e=>{[...$('o10').children].forEach(x=>x.className='');cfg.tc=e.target.value};
$('k4').oninput=e=>{[...$('o11').children].forEach(x=>x.className='');cfg.snc=e.target.value};
$('k5').oninput=e=>{[...$('o13').children].forEach(x=>x.className='');setBg(e.target.value)};
$('k6').oninput=e=>{[...$('o15').children].forEach(x=>x.className='');cfg.fc=e.target.value};
$('k7').oninput=e=>{[...$('o20').children].forEach(x=>x.className='');setNeb(e.target.value)};
$('k8').oninput=e=>{[...$('o22').children].forEach(x=>x.className='');cfg.fw=e.target.value};
let tmr;$('o2').oninput=e=>{cfg.cnt=e.target.value/100;$('o2v').textContent=e.target.value+'%';clearTimeout(tmr);tmr=setTimeout(()=>{init()},200)};
$('o12').oninput=e=>{cfg.sn=e.target.value/100;$('o12v').textContent=e.target.value+'%';mkSnow()};
$('o3').onchange=e=>{cfg.wm=+e.target.value;replay()};
$('o5').onchange=e=>{cfg.sm=+e.target.value;replay()};
$('o9').onchange=e=>{cfg.ts=+e.target.value};
$('o14').onchange=e=>{cfg.fs=+e.target.value};
$('o8').onchange=e=>{cfg.sa=+e.target.value;cfg.tg=Math.max(tA,nowT()+.05)};
['五角星','四角闪星','爱心','六角星','光球圆环'].forEach((n,i)=>{const o=document.createElement('option');o.value=i;o.textContent=n;$('o14').appendChild(o)});
TUNES.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=t.n;$('o17').appendChild(o)});
$('o17').onchange=e=>{cfg.tune=+e.target.value;restartMusic()};
$('o18').oninput=e=>{cfg.vol=e.target.value/100;$('o18v').textContent=e.target.value+'%';if(mG&&AC)mG.gain.setTargetAtTime(muted?0:cfg.vol,AC.currentTime,.05)};
$('rp').onclick=replay;

function applySig(){try{const b=sigT.getBBox();if(!b.width)return;
  sig.setAttribute('viewBox',(b.x-8)+' '+(b.y-8)+' '+(b.width+16)+' '+(b.height+16));
  const w=Math.max(60,Math.min(W*.62,(b.width+16)*Math.max(.42,Math.min(1.05,TH/520))));
  sig.style.width=w+'px';sigWpx=w;
  try{sigWpx=sig.offsetWidth||w}catch(_){}
  layoutTop();
}catch(e){}}
const FN=[['马善政毛笔','Ma Shan Zheng'],['柳建毛草','Liu Jian Mao Cao'],['志莽行书','Zhi Mang Xing'],['龙藏手写','Long Cang'],['站酷快乐体','ZCOOL KuaiLe'],['站酷小薇体','ZCOOL XiaoWei'],['站酷庆科黄油体','ZCOOL QingKe HuangYou'],['思源宋体','Noto Serif SC'],['Great Vibes 花体','Great Vibes'],['Dancing Script 连笔','Dancing Script'],['Pacifico 圆润花体','Pacifico'],['Allura 优雅花体','Allura'],['Satisfy 手写','Satisfy']];
FN.forEach(([n,v])=>{const o=document.createElement('option');o.value=v;o.textContent=n;$('o7').appendChild(o)});
function sigUp(){const f=$('o7').value;sigT.textContent=wT?(($('o21').value.trim())||'圣诞快乐'):($('o6').value||' ');sigT.style.fontFamily=`'${f}','Ma Shan Zheng','Liu Jian Mao Cao','KaiTi',serif`;applySig();
  if(document.fonts&&document.fonts.load)document.fonts.load(`52px '${f}'`,sigT.textContent).then(applySig,()=>{});
  cfg.tg=Math.max(tA,nowT()+.05)}
$('o6').oninput=sigUp;$('o7').onchange=sigUp;
$('o21').oninput=()=>{if(wT&&swapAt===0){sigT.textContent=($('o21').value.trim())||'圣诞快乐';applySig();cfg.tg=Math.max(tA,nowT()+.05)}};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(applySig);
$('gr').onclick=()=>{const p=$('pn');p.style.display=p.style.display==='block'?'none':'block'};
['gr','pn'].forEach(i=>$(i).addEventListener('pointerdown',e=>e.stopPropagation()));

// ---- 截图（长按图片保存） ----
function showShot(url){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px';
  d.innerHTML='<img style="max-width:90vw;max-height:78vh;border-radius:10px;border:1px solid #ff8cc8"><div style="color:#ffb3d6;font:13px -apple-system,sans-serif;letter-spacing:.1em">长按图片保存 · 点击空白处关闭</div>';
  d.querySelector('img').src=url;
  d.addEventListener('pointerdown',e=>e.stopPropagation());
  d.onclick=e=>{if(e.target.tagName!=='IMG')d.remove()};
  document.body.appendChild(d);
}
function snapshot(){
  try{
    const out=document.createElement('canvas');
    out.width=cv.width;out.height=cv.height;
    const g=out.getContext('2d');
    g.drawImage(cv,0,0);
    g.setTransform(dpr,0,0,dpr,0,0);
    const stxt=sigT.textContent.trim();
    if(stxt){
      const font=$('o7').value||DEF_FONT;
      let fsz=100;g.font=`${fsz}px '${font}',serif`;
      const mw=g.measureText(stxt).width||1;
      fsz=Math.max(10,Math.min(220,fsz*(Math.max(40,sigWpx*.86)/mw)));
      g.font=`${fsz}px '${font}','Ma Shan Zheng','KaiTi',serif`;
      g.textAlign='center';g.textBaseline='middle';
      g.shadowColor='#ff4fa3';g.shadowBlur=18;
      g.fillStyle='#ffc2de';
      g.fillText(stxt,sigX,sigY);
      g.shadowBlur=0;
    }
    const du=out.toDataURL('image/png');
    try{const a=document.createElement('a');a.href=du;a.download='MerryChristmas_'+Date.now()+'.png';document.body.appendChild(a);a.click();a.remove()}catch(_){}
    showShot(du);
  }catch(e){}
}
$('shot').onclick=snapshot;

// ---- 配置保存 / 自动保存 / 恢复默认 ----
const KEY='yuanfu_tree_v3',HEX=/^#[0-9a-f]{6}$/i;
function saveCfg(){try{const o=Object.assign({},cfg);delete o.tg;o.sigText=$('o6').value;o.sigFont=$('o7').value;o.greet=$('o19').value;o.bless=$('o21').value;o.muted=muted;
  localStorage.setItem(KEY,JSON.stringify(o));return true}catch(e){return false}}
let saveTmr;
function autoSave(){clearTimeout(saveTmr);saveTmr=setTimeout(saveCfg,600)}
$('pn').addEventListener('input',autoSave);
$('pn').addEventListener('change',autoSave);
$('sv').onclick=()=>{const b=$('sv'),ok=saveCfg();b.textContent=ok?'已保存 ✓':'保存失败';setTimeout(()=>{b.textContent='保存设置'},1600)};
function mark(id,list,cur){[...$(id).children].forEach((x,i)=>{x.className=JSON.stringify(list[i][1])===JSON.stringify(cur)?'on':''})}
function hx(id,v){if(typeof v==='string'&&HEX.test(v))$(id).value=v}
function syncUI(){
  $('o2').value=Math.round(cfg.cnt*100);$('o2v').textContent=$('o2').value+'%';
  $('o12').value=Math.round(cfg.sn*100);$('o12v').textContent=$('o12').value+'%';
  $('o3').value=cfg.wm;$('o5').value=cfg.sm;$('o8').value=cfg.sa;$('o9').value=cfg.ts;$('o14').value=cfg.fs;
  $('o17').value=cfg.tune;$('o18').value=Math.round(cfg.vol*100);$('o18v').textContent=$('o18').value+'%';
  mark('o1',PAL,cfg.p);mark('o4',STC,cfg.sc);mark('o10',TC,cfg.tc);mark('o11',SNC,cfg.snc);mark('o13',BGC,cfg.bg);mark('o15',FCC,cfg.fc);mark('o20',NBC,cfg.nc);mark('o22',FWC,cfg.fw);
  hx('k1',cfg.p[0]);hx('k2',cfg.sc);hx('k3',cfg.tc);hx('k4',cfg.snc);hx('k5',cfg.bg);hx('k6',cfg.fc);hx('k7',cfg.nc);hx('k8',cfg.fw);
}
function loadCfg(){try{const s=localStorage.getItem(KEY);if(!s){syncUI();return}const o=JSON.parse(s);
  ['cnt','wm','sm','sc','p','ts','tc','sa','fs','fc','sn','snc','bg','tune','vol','nc','fw'].forEach(k=>{if(o[k]!==undefined)cfg[k]=o[k]});
  cfg.sl=mix(cfg.sc,.6);
  if(Array.isArray(cfg.p)&&cfg.p.length==7)setPal(cfg.p);
  setBg(cfg.bg);
  if(o.sigText!==undefined)$('o6').value=o.sigText;
  if(o.greet!==undefined)$('o19').value=o.greet;
  if(o.bless!==undefined)$('o21').value=o.bless;
  if(o.sigFont&&[...$('o7').options].some(x=>x.value===o.sigFont))$('o7').value=o.sigFont;
  muted=!!o.muted;btn.classList.toggle('off',muted);
  syncUI();
  const f=$('o7').value;sigT.textContent=$('o6').value||' ';sigT.style.fontFamily=`'${f}','Ma Shan Zheng','Liu Jian Mao Cao','KaiTi',serif`;
  if(document.fonts&&document.fonts.load)document.fonts.load(`52px '${f}'`,sigT.textContent).then(applySig,()=>{});
}catch(e){syncUI()}}
$('rst').onclick=()=>{
  try{localStorage.removeItem(KEY)}catch(e){}
  const o=JSON.parse(JSON.stringify(DEF));
  Object.keys(o).forEach(k=>{cfg[k]=o[k]});
  cfg.p=DEF.p.slice();
  muted=false;btn.classList.remove('off');
  $('o6').value=DEF_SIG;$('o7').value=DEF_FONT;$('o19').value='';$('o21').value=DEF_BL;
  setPal(cfg.p);setBg(cfg.bg);setNeb(cfg.nc);cfg.sl=mix(cfg.sc,.6);
  syncUI();sigUp();
  replay();
  pf.textContent='已恢复默认设置';pf.style.opacity=1;setTimeout(()=>{pf.style.opacity=0},2000);
};

loadCfg();setNeb(cfg.nc);
resize();init();requestAnimationFrame(frame);
